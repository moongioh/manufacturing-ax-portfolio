<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>워크스루 — 관리회계 · 제품별 손익 (개별법 COGS · 비용원장 · 은행앵커 역산)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0" rel="stylesheet">
<style>
/* inlined: assets/canon-tokens.css */
/* canon-tokens.css — Claude Design 템플릿(.dc)이 기대하는 토큰 파일명.
   실체는 워크스페이스 SSoT 포인터 (plan workspace/0025 D5 — 값 복제 금지).
   raw .dc 라이브 프리뷰(http 서빙)가 이 상대경로를 로드하고,
   dc-compile.mjs는 @import를 따라가 최종 값을 번들에 인라인한다. */
/* =============================================================
   DESIGN CANON v2 — 문서 양식 공용 토큰 SSoT (plan workspace/0025)
   원본: 사용자 제작 Claude Design 템플릿 assets/템플릿/정본 쇼케이스.dc.html
   적용 대상: 모든 문서 산출물(교육·워크스루·이력서·보고서·기술문서).
   ERP React 앱(카테고리 1)은 대상 아님 — M3 --md-sys-* 체계 유지.

   사용법(Track B 자유양식):
     <link rel="stylesheet" href=".../design-tokens-canon-v2.css">
     <body> 안 최상위 래퍼에 class="canon" (+ data-theme="dark" 선택)
   Raw hex는 이 파일(토큰 정의부)에서만 허용 — 소비측은 var(--cn-*)만.
   v1(design-tokens-creative.css)·techspec.css는 legacy — 신규 사용 금지.
   ============================================================= */

.canon{
  --cn-primary:#3B82F6; --cn-primary-deep:#2563EB; --cn-link:#2563EB;
  --cn-bg:#f5f8fc; --cn-card:#ffffff; --cn-card-glass:rgba(255,255,255,.82);
  --cn-line:#e2e9f2; --cn-line-strong:#cbd7e4;
  --cn-ink:#1c2a3d; --cn-muted:#5b6b80; --cn-faint:#8b99ac;
  --cn-tint:#eaf1fb; --cn-tint-deep:#dbe7f9;
  --cn-purple:#8B5CF6; --cn-teal:#14B8A6; --cn-amber:#F59E0B; --cn-rose:#F43F5E; --cn-green:#10B981;
  --cn-code-bg:#f1f5fa; --cn-code-ink:#334155;
  --cn-shadow-1:0 1px 2px rgba(28,42,61,.05),0 2px 8px rgba(28,42,61,.04);
  --cn-shadow-2:0 2px 4px rgba(28,42,61,.05),0 10px 28px rgba(37,99,235,.08);
  --cn-mesh:radial-gradient(at 90% -4%,rgba(59,130,246,.09) 0,transparent 50%),radial-gradient(at 2% 100%,rgba(139,92,246,.08) 0,transparent 46%),#f5f8fc;
  --cn-ease:cubic-bezier(.2,0,0,1);
  --cn-grad-id:linear-gradient(135deg,#3B82F6,#7C3AED);
}
.canon[data-theme="dark"]{
  --cn-primary:#6EA3F7; --cn-primary-deep:#8AB4F8; --cn-link:#8AB4F8;
  --cn-bg:#0e1420; --cn-card:#161e2e; --cn-card-glass:rgba(22,30,46,.82);
  --cn-line:#243146; --cn-line-strong:#31415c;
  --cn-ink:#e8edf6; --cn-muted:#98a8bf; --cn-faint:#67788f;
  --cn-tint:#1a2740; --cn-tint-deep:#20304f;
  --cn-code-bg:#111a2a; --cn-code-ink:#b7c5da;
  --cn-shadow-1:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
  --cn-shadow-2:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
  --cn-mesh:radial-gradient(at 90% -4%,rgba(59,130,246,.12) 0,transparent 50%),radial-gradient(at 2% 100%,rgba(139,92,246,.1) 0,transparent 46%),#0e1420;
}

/* ── 베이스 (쇼케이스 helmet 규칙 승계) ── */
.canon{
  min-height:100vh;background:var(--cn-mesh);background-attachment:fixed;
  color:var(--cn-ink);font-size:15px;line-height:1.7;
  font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
.canon a{color:var(--cn-link);text-decoration:none}
.canon a:hover{color:var(--cn-primary)}
.canon .mi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;display:inline-block;vertical-align:-0.15em;font-variation-settings:'FILL' 0,'wght' 400}

/* ── 인쇄 (DESIGN.md §3E) — 다크로 보던 중 인쇄해도 종이는 라이트 ── */
@media print{
  .canon,.canon[data-theme="dark"]{
    --cn-primary:#3B82F6; --cn-primary-deep:#2563EB; --cn-link:#2563EB;
    --cn-bg:#ffffff; --cn-card:#ffffff; --cn-card-glass:#ffffff;
    /* 그림자 소실 → 보더가 경계 승계(한 단계 진하게) */
    --cn-line:#cbd7e4; --cn-line-strong:#9fb1c5;
    --cn-ink:#1c2a3d; --cn-muted:#5b6b80; --cn-faint:#8b99ac;
    --cn-tint:#eaf1fb; --cn-tint-deep:#dbe7f9;
    --cn-code-bg:#f1f5fa; --cn-code-ink:#334155;
    --cn-shadow-1:none; --cn-shadow-2:none;
    --cn-mesh:#ffffff;
    background:#fff;
  }
}


</style>
<style>
html,body{margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cn-link,#2563EB);text-decoration:none}
a:hover{color:var(--cn-primary,#3B82F6)}
.mi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;display:inline-block;vertical-align:-0.15em;font-variation-settings:'FILL' 0,'wght' 400}
@media (max-width:960px){ .cn-rail{display:none!important} .cn-main{padding-left:32px!important} }
@keyframes cnFlow{to{background-position:24px 0}}
svg text{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif}
svg .mono{font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<!-- dc-compile.mjs 번들 (plan workspace/0025) — 원본: 워크스루-관리회계.dc.html · 재편집은 원본 .dc에서 -->
<script type="text/x-dc-template">
<div class="canon" data-theme="{{ theme }}" style="min-height:100vh;background:var(--cn-mesh);background-attachment:fixed;color:var(--cn-ink);font-size:15px;line-height:1.7;transition:background .25s,color .25s">

  <nav class="cn-rail" style="position:fixed;top:0;left:0;bottom:0;width:236px;box-sizing:border-box;padding:20px 14px;display:flex;flex-direction:column;gap:2px;background:var(--cn-card-glass);backdrop-filter:blur(14px);border-right:1px solid var(--cn-line);z-index:50">
    <div style="display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--cn-line);margin-bottom:10px">
      <div style="width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--cn-grad-id,linear-gradient(135deg,#3B82F6,#7C3AED));flex:none"><span class="mi" style="font-size:18px">insights</span></div>
      <div>
        <div style="font-size:13.5px;font-weight:800;letter-spacing:-.01em">관리회계</div>
        <div style="font-size:10.5px;color:var(--cn-faint);font-family:'JetBrains Mono',monospace">walkthrough</div>
      </div>
    </div>
    <div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--cn-faint);text-transform:uppercase;padding:8px 10px 4px">목차</div>
    <sc-for list="{{ navItems }}" as="nv" hint-placeholder-count="6">
      <a href="{{ nv.href }}" style="display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--cn-ink)" style-hover="background:var(--cn-tint);color:var(--cn-primary-deep)">
        <span class="mi" style="font-size:16px;color:var(--cn-primary)">{{ nv.icon }}</span>{{ nv.label }}
      </a>
    </sc-for>
    <div style="flex:1"></div>
    <a href="워크스루.html" style="display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--cn-muted)" style-hover="background:var(--cn-tint);color:var(--cn-primary-deep)">
      <span class="mi" style="font-size:16px;color:var(--cn-primary)">hub</span>워크스루 허브
    </a>
    <a href="../index.html" style="display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--cn-muted)" style-hover="background:var(--cn-tint);color:var(--cn-primary-deep)">
      <span class="mi" style="font-size:16px;color:var(--cn-primary)">arrow_back</span>포트폴리오 홈
    </a>
    <button onClick="{{ toggleTheme }}" style="display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid var(--cn-line-strong);background:var(--cn-card);color:var(--cn-ink);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer" style-hover="border-color:var(--cn-primary)">
      <span class="mi" style="font-size:16px">{{ themeIcon }}</span>{{ themeLabel }}
    </button>
  </nav>

  <main class="cn-main" style="padding:44px 40px 90px 284px;max-width:1280px;margin:0 auto;box-sizing:border-box">

    <header style="border-radius:18px;padding:34px 36px;margin-bottom:20px;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--cn-tint) 0%,var(--cn-bg) 70%);border:1px solid var(--cn-line);box-shadow:var(--cn-shadow-1)">
      <div style="position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--cn-primary),var(--cn-purple),var(--cn-teal))"></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:var(--cn-primary-deep);letter-spacing:.04em;margin-bottom:10px">WALKTHROUGH · 개별법 COGS · 은행앵커 역산</div>
      <h1 style="margin:0 0 10px;font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.25">관리회계 · 제품별 손익</h1>
      <p style="margin:0;max-width:680px;font-size:15px;color:var(--cn-muted)">"이 제품, 이 기간에 <b style="color:var(--cn-ink)">얼마 남았나</b>?" — 재무회계가 아니라 <b style="color:var(--cn-ink)">경영 판단용 손익</b>을 목표로 합니다.
        매출은 출고 원장에서, 원가는 <b style="color:var(--cn-ink)">개별법</b>으로 배치마다, 비용은 매입·부대비 원장에서 모아 제품별·기간별로 묶고,
        그 모든 숫자가 새지 않는지 <b style="color:var(--cn-ink)">은행 입출금을 앵커</b>로 역검증합니다.</p>
      <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap">
        <span style="font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--cn-tint-deep);color:var(--cn-primary-deep)">개별법 COGS</span>
        <span style="font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--cn-tint-deep);color:var(--cn-primary-deep)">결정 4건</span>
        <span style="font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--cn-tint-deep);color:var(--cn-primary-deep)">읽기 4분</span>
      </div>
    </header>

    <div style="border-radius:12px;border:1px solid var(--cn-line);border-left:4px solid var(--cn-primary);background:var(--cn-card);padding:16px 19px;box-shadow:var(--cn-shadow-1);margin-bottom:44px;display:flex;gap:12px;align-items:flex-start">
      <span class="mi" style="font-size:20px;color:var(--cn-primary);flex:none;margin-top:2px">bolt</span>
      <div style="font-size:13px;line-height:1.75;color:var(--cn-muted)">
        <b style="color:var(--cn-ink)">TL;DR</b> —
        <b style="color:var(--cn-ink)">무엇</b>: 매출은 출고 원장에서, 원가는 개별법으로 배치마다, 비용은 매입·부대비 원장에서 모아 제품별·기간별 손익을 뽑습니다. ·
        <b style="color:var(--cn-ink)">왜</b>: 손익을 저장된 현재값이 아니라 출고·생산·매입 사건의 합에서 파생시키고, 은행 입출금을 외부 진실 앵커로 삼아 역검증합니다. ·
        <b style="color:var(--cn-ink)">결과</b>: 화학 발포 제품은 배치마다 원가차가 커 이동평균 대신 배치 스냅샷을 원장에 남기고(부호 보존 취소), 과거 매출·원가까지 재정합했으며, 간접비 배분이 필요한 통합 손익 capstone(0087)은 데이터가 무르익을 때로 의도적으로 파킹했습니다.
      </div>
    </div>

    <section id="s1" style="margin-bottom:48px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(135deg,#3B82F6,#2563EB)">1</div>
        <h2 style="margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em">큰 그림 — 세 흐름을 하나의 손익으로, 은행앵커로 역검증</h2>
      </div>
      <p style="margin:0 0 18px 42px;font-size:12.5px;color:var(--cn-faint)">가운데 손익 집계가 매출·원가·비용이 모이는 지점입니다. 아래 재생으로 단계별 설명을 볼 수 있습니다.</p>

      <div style="background:var(--cn-card);border:1px solid var(--cn-line);border-radius:14px;padding:24px;box-shadow:var(--cn-shadow-1)">
        <svg viewBox="0 0 1000 480" style="width:100%;height:auto;display:block">
          <defs>
            <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--cn-faint)"></path>
            </marker>
            <marker id="arrPA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--cn-primary)"></path>
            </marker>
          </defs>

          <!-- ① 매출 -->
          <rect x="16" y="20" width="300" height="76" rx="12" fill="var(--cn-card)" stroke="var(--cn-line-strong)"></rect>
          <text x="166" y="46" text-anchor="middle" font-size="13" font-weight="800" fill="var(--cn-ink)">① 매출</text>
          <text x="166" y="66" text-anchor="middle" font-size="10" fill="var(--cn-muted)" class="mono">출고 원장 · amount</text>
          <text x="166" y="82" text-anchor="middle" font-size="9.5" fill="var(--cn-faint)">사건의 합</text>

          <!-- ② 원가 -->
          <rect x="350" y="20" width="300" height="76" rx="12" fill="var(--cn-card)" stroke="var(--cn-line-strong)"></rect>
          <text x="500" y="46" text-anchor="middle" font-size="13" font-weight="800" fill="var(--cn-ink)">② 원가</text>
          <text x="500" y="66" text-anchor="middle" font-size="10" fill="var(--cn-muted)" class="mono">개별법 배치 · cost_amount</text>
          <text x="500" y="82" text-anchor="middle" font-size="9.5" fill="var(--cn-faint)">이동평균 아님</text>

          <!-- ③ 비용 -->
          <rect x="684" y="20" width="300" height="76" rx="12" fill="var(--cn-card)" stroke="var(--cn-line-strong)"></rect>
          <text x="834" y="46" text-anchor="middle" font-size="13" font-weight="800" fill="var(--cn-ink)">③ 비용</text>
          <text x="834" y="66" text-anchor="middle" font-size="10" fill="var(--cn-muted)" class="mono">매입 · 부대비 원장</text>
          <text x="834" y="82" text-anchor="middle" font-size="9.5" fill="var(--cn-faint)">계정별 집계</text>

          <!-- 수렴 화살표 -->
          <path d="M 166 96 C 166 140, 350 160, 430 182" fill="none" stroke="var(--cn-primary)" stroke-width="1.8" marker-end="url(#arrPA)"></path>
          <path d="M 500 96 L 500 182" fill="none" stroke="var(--cn-primary)" stroke-width="1.8" marker-end="url(#arrPA)"></path>
          <path d="M 834 96 C 834 140, 650 160, 570 182" fill="none" stroke="var(--cn-primary)" stroke-width="1.8" marker-end="url(#arrPA)"></path>

          <!-- 손익 집계 (강조) -->
          <rect x="370" y="186" width="260" height="98" rx="14" fill="var(--cn-tint)" stroke="var(--cn-primary)" stroke-width="2"></rect>
          <text x="500" y="216" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--cn-primary-deep)">손익 집계</text>
          <text x="500" y="236" text-anchor="middle" font-size="10.5" fill="var(--cn-primary-deep)" class="mono">Σ매출 − Σ개별법원가 − Σ비용</text>
          <text x="500" y="254" text-anchor="middle" font-size="10" fill="var(--cn-muted)">저장값 아님 · 사건의 합에서 파생</text>
          <text x="500" y="270" text-anchor="middle" font-size="9" fill="var(--cn-faint)" class="mono">제품별 · 기간별</text>

          <!-- 아래로 -->
          <path d="M 500 284 L 500 322" fill="none" stroke="var(--cn-primary)" stroke-width="1.8" marker-end="url(#arrPA)"></path>

          <!-- ④ 은행앵커 -->
          <rect x="330" y="326" width="340" height="92" rx="14" fill="var(--cn-bg)" stroke="var(--cn-teal)" stroke-width="1.6"></rect>
          <text x="500" y="356" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--cn-ink)">④ 은행 입출금 앵커</text>
          <text x="500" y="376" text-anchor="middle" font-size="10.5" fill="var(--cn-muted)" class="mono">커버리지 역산 · plan 0109</text>
          <text x="500" y="392" text-anchor="middle" font-size="9.5" fill="var(--cn-faint)">안 덮이는 구멍 = 다음 회계 갭</text>

          <!-- 역검증 피드백 (점선) -->
          <path d="M 668 350 C 900 310, 950 110, 850 24" fill="none" stroke="var(--cn-faint)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrA)"></path>
          <text x="758" y="180" font-size="10.5" fill="var(--cn-faint)">역검증 — 시스템이 스스로를 채점</text>

          <!-- 파생 스트립 -->
          <rect x="16" y="410" width="968" height="56" rx="12" fill="var(--cn-bg)" stroke="var(--cn-line-strong)"></rect>
          <text x="36" y="432" font-size="11.5" font-weight="800" fill="var(--cn-ink)">파생 읽기 — 손익은 저장된 현재값이 아니라 사건의 합 (현재값 컬럼 없음)</text>
          <text x="36" y="450" font-size="9.5" fill="var(--cn-muted)" class="mono">매출=Σ출고 amount · 원가=Σ배치 cost_amount(개별법 스냅샷) · 비용=Σ매입·부대비 원장 · 은행 커버리지로 외부 검증</text>
        </svg>
      </div>

      <div style="background:var(--cn-card);border:1px solid var(--cn-line);border-radius:14px;padding:24px;box-shadow:var(--cn-shadow-1);margin-top:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap">
          <div style="font-size:12px;font-weight:700;color:var(--cn-muted);margin-right:auto">단계별 보기 — 노드를 클릭하거나 '다음'으로 넘기세요</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:var(--cn-muted)">{{ flowStepText }}</div>
          <button onClick="{{ stepPrev }}" style="display:inline-flex;align-items:center;gap:5px;border:1px solid var(--cn-line-strong);border-radius:999px;padding:8px 16px;background:var(--cn-card);color:var(--cn-ink);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer" style-hover="border-color:var(--cn-primary);color:var(--cn-primary-deep)">
            <span class="mi" style="font-size:16px">chevron_left</span>이전
          </button>
          <button onClick="{{ stepNext }}" style="display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:8px 18px;background:var(--cn-primary);color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(59,130,246,.25)" style-hover="background:var(--cn-primary-deep)">

          </button>

        <div style="display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding-bottom:4px">

            <div style="display:flex;align-items:center;gap:8px;flex:{{ f.flex }}">
              <div onClick="{{ f.go }}" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid {{ f.bd }};background:{{ f.bg }};border-radius:12px;padding:12px 14px;min-width:78px;transition:border-color .3s,background .3s,box-shadow .3s;box-shadow:{{ f.sh }}">
                <span class="mi" style="font-size:20px;color:{{ f.ic }};transition:color .3s">{{ f.icon }}</span>
                <div style="font-size:11.5px;font-weight:700;color:{{ f.tc }};transition:color .3s;white-space:nowrap">{{ f.title }}</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--cn-faint);white-space:nowrap">{{ f.sub }}</div>
              </div>
              <sc-if value="{{ f.hasConn }}" hint-placeholder-val="{{ true }}">
                <div style="flex:1;height:2px;min-width:12px;background:{{ f.connBg }};animation:{{ f.connAnim }}"></div>
              </sc-if>
            </div>
          </sc-for>
        </div>
        <div style="margin-top:16px;border-radius:10px;background:var(--cn-tint);padding:12px 16px;font-size:12.5px;color:var(--cn-ink);display:flex;gap:9px;align-items:flex-start">
          <span class="mi" style="font-size:17px;color:var(--cn-primary);flex:none;margin-top:1px">subtitles</span>
          <span>{{ flowCaption }}</span>
        </div>
      </div>
    </section>

    <section id="s2" style="margin-bottom:48px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(135deg,#8B5CF6,#7C3AED)">2</div>
        <h2 style="margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em">원가는 개별법 — 배치마다 진짜 원가</h2>
      </div>
      <p style="margin:0 0 18px 42px;font-size:12.5px;color:var(--cn-faint)">plan 0015 — 이동평균이 아니라 배치별 실제 원가를 스냅샷합니다.</p>

      <div style="max-width:760px;margin-left:42px;display:flex;flex-direction:column;gap:12px">
        <div style="border-radius:12px;border:1px solid var(--cn-line);border-left:4px solid var(--cn-primary);background:var(--cn-card);padding:14px 17px;box-shadow:var(--cn-shadow-1);display:flex;gap:11px;align-items:flex-start">
          <span class="mi" style="font-size:19px;color:var(--cn-primary);flex:none;margin-top:1px">calculate</span>
          <div style="font-size:12.5px;line-height:1.7;color:var(--cn-ink)">
            <span style="font-family:'JetBrains Mono',monospace;color:var(--cn-primary-deep);font-weight:700">장당 원가 = 연결 batch 총 원료비 ÷ 실제 생산장수</span><br>
            <span style="color:var(--cn-muted)">출고 시 <code style="font-family:'JetBrains Mono',monospace;color:var(--cn-primary-deep)">cost_amount = 장당원가 × 수량</code>으로 원장에 스냅샷(부호 보존 → 취소 시 상계 net-out).</span>
          </div>
        </div>
        <div style="border-radius:12px;border:1px solid var(--cn-line);border-left:4px solid var(--cn-teal);background:var(--cn-card);padding:14px 17px;box-shadow:var(--cn-shadow-1);display:flex;gap:11px;align-items:flex-start">
          <span class="mi" style="font-size:19px;color:var(--cn-teal);flex:none;margin-top:1px">hub</span>
          <div style="font-size:12.5px;line-height:1.7;color:var(--cn-muted)"><b style="color:var(--cn-ink)">왜 개별법인가</b> — 화학 발포 제품은 배치마다 발포 밀도·원가가 확연히 다릅니다. 이동평균으로 평활하면 실제 배치 간 원가차가 뭉개져 수익성이 왜곡됩니다.
            주문생산이라 회계기준(IAS 2)도 개별법이 정답 — 그 발주에 실제로 연결된 생산 배치의 원가를 그대로 씁니다.</div>
        </div>
        <div style="border-radius:12px;border:1px solid var(--cn-line);background:var(--cn-card);padding:14px 17px;box-shadow:var(--cn-shadow-1);display:flex;gap:11px;align-items:flex-start">

          <div style="font-size:12.5px;line-height:1.7;color:var(--cn-muted)"><b style="color:var(--cn-ink)">과거 매출·원가도 정합화했습니다</b> — 저장된 매출 스냅샷이 잘못 계산돼 있으면 미래분만 고쳐도 장부가 계속 어긋나므로,
            과거분을 올바른 식으로 재산정해 채권·손익이 자동으로 맞게 만들었습니다(단가 해석 버그 정정 포함).</div>
        </div>
      </div>
    </section>

    <section id="s3" style="margin-bottom:48px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(135deg,#14B8A6,#0D9488)">3</div>
        <h2 style="margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em">비용 · 매입 원장 — 재판매를 가려낸다</h2>
      </div>
      <p style="margin:0 0 18px 42px;font-size:12.5px;color:var(--cn-faint)">plan 0070 — 생산 원재료와 재판매 상품, 판관비를 분류해 적재합니다.</p>

      <div style="background:var(--cn-card);border:1px solid var(--cn-line);border-radius:14px;box-shadow:var(--cn-shadow-1);overflow:hidden;margin-left:42px">
        <table style="width:100%;border-collapse:collapse;font-size:12.5px">
          <thead>
            <tr style="background:var(--cn-tint)">
              <th style="text-align:left;padding:11px 16px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--cn-primary-deep)">구분</th>
              <th style="text-align:left;padding:11px 16px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--cn-primary-deep)">처리</th>
              <th style="text-align:left;padding:11px 16px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--cn-primary-deep)">이유</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{ costRows }}" as="r" hint-placeholder-count="3">
              <tr style="border-top:1px solid var(--cn-line)" style-hover="background:var(--cn-tint)">
                <td style="padding:11px 16px;font-weight:700;white-space:nowrap">{{ r.d }}</td>
                <td style="padding:11px 16px;color:var(--cn-muted)">{{ r.e }}</td>
                <td style="padding:11px 16px;color:var(--cn-muted);font-family:'JetBrains Mono',monospace;font-size:11.5px">{{ r.n }}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>

      <div style="margin-left:42px;margin-top:14px;border-radius:12px;border:1px solid var(--cn-line);border-left:4px solid var(--cn-amber);background:var(--cn-card);padding:14px 17px;box-shadow:var(--cn-shadow-1);display:flex;gap:11px;align-items:flex-start">
        <span class="mi" style="font-size:19px;color:var(--cn-amber);flex:none;margin-top:1px">filter_center_focus</span>
        <div style="font-size:12.5px;line-height:1.7;color:var(--cn-muted)"><b style="color:var(--cn-ink)">미분류를 triage로 줄입니다</b> — 매입 내역에 계정이 안 붙은 미분류 건을 입고관리 UI를 재사용해 사람이 빠르게 분류합니다.
          생산품(제조)과 재판매 상품을 섞으면 원가율이 왜곡되므로, 이 분류가 손익 정확도의 전제입니다.</div>
      </div>
    </section>

    <section id="s4" style="margin-bottom:48px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(135deg,#F59E0B,#D97706)">4</div>
        <h2 style="margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em">경영 리포트 — 한 장으로 보는 현황</h2>
      </div>
      <p style="margin:0 0 18px 42px;font-size:12.5px;color:var(--cn-faint)">plan 0042 · 0144 — 원장을 GROUP BY한 파생 뷰 3종입니다.</p>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-left:42px">
        <sc-for list="{{ reportCards }}" as="rc" hint-placeholder-count="3">
          <div style="background:var(--cn-card);border:1px solid var(--cn-line);border-radius:14px;padding:20px;box-shadow:var(--cn-shadow-1)">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <span class="mi" style="font-size:18px;color:var(--cn-primary)">{{ rc.icon }}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--cn-primary)">{{ rc.tag }}</span>
            </div>
            <div style="font-size:13.5px;font-weight:800;margin-bottom:5px">{{ rc.title }}</div>
            <div style="font-size:12px;color:var(--cn-muted);line-height:1.6">{{ rc.body }}</div>
          </div>
        </sc-for>
      </div>

      <div style="margin-left:42px;margin-top:14px;border-radius:12px;border:1px solid var(--cn-line);background:var(--cn-card);padding:14px 17px;box-shadow:var(--cn-shadow-1);display:flex;gap:11px;align-items:flex-start">
        <span class="mi" style="font-size:19px;color:var(--cn-muted);flex:none;margin-top:1px">monitoring</span>
        <div style="font-size:12.5px;line-height:1.7;color:var(--cn-muted)"><b style="color:var(--cn-ink)">모두 파생 뷰입니다</b> — 리포트는 숫자를 따로 저장하지 않고 출고·매입·수금 원장을 <span style="font-family:'JetBrains Mono',monospace;color:var(--cn-primary-deep)">GROUP BY</span>한 결과라,
          "리포트와 원장이 안 맞는" 동기화 버그가 구조적으로 안 생깁니다(발주·출고 SSoT의 보상).</div>
      </div>
    </section>

    <section id="s5" style="margin-bottom:48px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(135deg,#F43F5E,#E11D48)">5</div>
        <h2 style="margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em">은행앵커 커버리지 역산 + 통합 손익(로드맵)</h2>
      </div>
      <p style="margin:0 0 18px 42px;font-size:12.5px;color:var(--cn-faint)">plan 0109 구축 · 0087 파킹 — 무엇을 더 만들지가 아니라 무엇이 아직 안 잡히는지로 접근합니다.</p>

      <div style="max-width:760px;margin-left:42px;display:flex;flex-direction:column;gap:12px">
        <div style="border-radius:12px;border:1px solid var(--cn-line);border-left:4px solid var(--cn-teal);background:var(--cn-card);padding:14px 17px;box-shadow:var(--cn-shadow-1);display:flex;gap:11px;align-items:flex-start">
          <span class="mi" style="font-size:19px;color:var(--cn-teal);flex:none;margin-top:1px">rule</span>
          <div style="font-size:12.5px;line-height:1.7;color:var(--cn-muted)"><b style="color:var(--cn-ink)">은행 입출금 = 외부 진실 앵커</b> — 주거래은행 입출금 내역을 기준선으로 두고, 시스템이 설명하는 매출·매입·비용이 그 흐름을 얼마나 덮는지(커버리지)를 역산합니다.
            안 덮이는 구멍이 곧 "다음에 잡을 회계 갭" — 우선순위가 데이터에서 나옵니다.</div>
        </div>
        <div style="border-radius:12px;border:1px solid var(--cn-line);border-left:4px solid var(--cn-purple);background:var(--cn-card);padding:14px 17px;box-shadow:var(--cn-shadow-1);display:flex;gap:11px;align-items:flex-start">
          <span class="mi" style="font-size:19px;color:var(--cn-purple);flex:none;margin-top:1px">bookmark</span>
          <div style="font-size:12.5px;line-height:1.7;color:var(--cn-muted)"><b style="color:var(--cn-ink)">통합 손익 capstone(0087)은 의도적으로 파킹했습니다</b> — 제품별 손익을 하나의 완전한 레이어로 묶는 것은 매력적이지만,
            간접비의 제품별 배분은 현재 데이터·2인 운영 규모에서 ROI가 낮아 구성요소(개별법 COGS·비용원장·리포트·은행앵커)를 먼저 세우고 통합 캡스톤은 데이터가 무르익을 때로 미뤘습니다.
            비전을 접은 게 아니라 <b style="color:var(--cn-ink)">순서를 정한</b> 것 — 구성요소는 이미 가동 중입니다.</div>
        </div>
      </div>
    </section>

    <section id="s6" style="margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(135deg,#06B6D4,#0891B2)">6</div>
        <h2 style="margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em">결정과 트레이드오프 — 왜 이렇게 지었나</h2>
      </div>
      <p style="margin:0 0 18px 42px;font-size:12.5px;color:var(--cn-faint)">네 개의 구조적 결정 — 채택·기각·근거.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-left:42px">
        <sc-for list="{{ decisions }}" as="dc" hint-placeholder-count="4">
          <div style="background:var(--cn-card);border:1px solid var(--cn-line);border-radius:14px;padding:20px;box-shadow:var(--cn-shadow-1)">
            <div style="font-size:13.5px;font-weight:800;margin-bottom:10px">{{ dc.q }}</div>
            <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px">
              <span class="mi" style="font-size:16px;color:var(--cn-green);flex:none;margin-top:2px">check_circle</span>
              <div style="font-size:12.5px;line-height:1.55"><b>채택</b> — {{ dc.pick }}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px">
              <span class="mi" style="font-size:16px;color:var(--cn-rose);flex:none;margin-top:2px">cancel</span>
              <div style="font-size:12.5px;line-height:1.55;color:var(--cn-muted)"><b style="color:var(--cn-ink)">기각</b> — {{ dc.drop }}</div>
            </div>
            <div style="font-size:12px;color:var(--cn-muted);line-height:1.6;border-top:1px solid var(--cn-line);padding-top:8px">{{ dc.why }}</div>
          </div>
        </sc-for>
      </div>
    </section>

    <footer style="margin-top:40px;padding-top:20px;border-top:1px solid var(--cn-line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--cn-faint);font-family:'JetBrains Mono',monospace">
      <span>구축 plan 0015 · 0070 · 0042 · 0144 · 0109 · 파킹 0087 · 문서 체계 workspace 0007</span><span>manufacturing-ax-portfolio · 2026-07</span>
    </footer>
  </main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;\&quot;light\&quot;|\&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;테마&quot;}}">
class Component extends DCLogic {
  state = { theme: null, flowStep: -1 };
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const theme = this.state.theme ?? this.props.theme ?? "light";
    const dark = theme === "dark";
    const { flowStep } = this.state;
    const flowBase = [
      { icon: "receipt_long", title: "① 매출", sub: "출고 원장", cap: "발주·출고 SSoT의 amount(제품별·거래처별)가 사건의 합으로 쌓여 매출이 됩니다." },
      { icon: "precision_manufacturing", title: "② 원가", sub: "개별법 배치", cap: "생산 batch의 실 원료비를 실제 생산장수로 나눈 장당원가를, 출고 시 cost_amount로 원장에 스냅샷합니다(이동평균 아님)." },
      { icon: "account_balance_wallet", title: "③ 비용", sub: "매입·부대비 원장", cap: "매입·판관비를 계정별로 분류 적재하고, 생산 원재료 매입과 재판매 상품 매입을 구분합니다." },
      { icon: "account_balance", title: "④ 앵커", sub: "은행 입출금", cap: "실제 통장 흐름을 진실 기준선으로 두고, 시스템이 설명하는 매출·매입·비용이 그 흐름을 얼마나 덮는지(커버리지) 역산합니다." },
    ];
    return {
      theme,
      themeIcon: dark ? "light_mode" : "dark_mode",
      themeLabel: dark ? "라이트 모드" : "다크 모드",
      toggleTheme: () => this.setState({ theme: dark ? "light" : "dark" }),
      navItems: [
        { href: "#s1", icon: "map", label: "한 장 지도" },
        { href: "#s2", icon: "calculate", label: "개별법 원가" },
        { href: "#s3", icon: "account_balance_wallet", label: "비용·매입 원장" },

      flowCaption: flowStep < 0 ? "'다음'을 누르거나 노드를 클릭하면 각 단계의 설명이 여기 표시됩니다." : flowBase[Math.min(flowStep, flowBase.length - 1)].cap,
      stepNext: () => this.setState({ flowStep: Math.min(flowStep + 1, flowBase.length - 1) }),
      stepPrev: () => this.setState({ flowStep: Math.max(flowStep - 1, -1) }),
      costRows: [
        { d: "생산 원재료 매입", e: "제품 원가로 흐름 (개별법 COGS의 입력)", n: "제조원가" },
        { d: "재판매 상품 매입", e: "생산 안 하고 되파는 품목 — 별도 분류", n: "상품매출원가(제조와 구분)" },
        { d: "판관비 · 부대비", e: "계정별로 분류 적재(자유양식 + 특화 카드)", n: "기간비용" },
      ],
      reportCards: [
        { icon: "summarize", tag: "0042", title: "월간 경영 리포트", body: "매출·원가·생산·채권을 한 장으로 요약 — \"이번 달 어땠나\"를 경영진이 즉시 파악." },
        { icon: "handshake", tag: "0144", title: "거래처별 매입·매출 대시보드", body: "거래처 한 곳의 사고팔기 전체를 읽기전용으로 — 관계별 수익성·의존도 가시화." },
        { icon: "schedule", tag: "AGING", title: "채권 연령분석", body: "미수금을 경과 기간대로 나눠 오래된 채권을 먼저 드러냄 — 자금 리스크 조기 신호." },
      ],
      decisions: [
        { q: "왜 이동평균이 아니라 개별법 원가인가?", pick: "출고 시 연결 배치의 실제 단위원가를 스냅샷.", drop: "이동평균 / 직전 1개 배치 단가.", why: "배치별 발포 밀도·원가가 진짜 다르다 → 이동평균의 평활이 배치 원가차를 뭉개 수익성을 왜곡한다. 주문생산이라 회계기준도 개별법. \"직전 1배치\"는 이상치 하나가 이후 전부를 오염시켜 비인정." },
        { q: "왜 은행 입출금을 앵커로 삼나?", pick: "실제 통장 흐름을 진실 기준선으로 커버리지 역산.", drop: "시스템 내부 숫자끼리만 대사(내부 정합).", why: "내부 숫자끼리 맞아도 현실과 어긋날 수 있다(둘 다 같은 실수를 하면 못 잡음). 은행은 시스템 밖의 사실이라 편향이 없다. 그 흐름을 얼마나 설명하는지로 채점하면 \"안 잡히는 것\"이 드러나 우선순위가 객관적으로 정해진다." },

        { q: "왜 재판매 상품을 제조와 분리하나?", pick: "생산 안 하고 되파는 품목을 별도 분류(상품매출원가).", drop: "모든 매입을 제조원가로 뭉뚱그리기.", why: "재판매 상품은 원가 구조가 제조품과 완전히 다르다. 섞으면 제조 원가율이 왜곡돼 \"우리 제품이 얼마 남나\"를 못 본다. 분류가 손익 정확도의 전제라 미분류를 triage로 좁힌다." },
      ],
    };
  }
}

<script>
/* =============================================================
   DESIGN CANON v2 — .dc 템플릿 자체 렌더러 (plan workspace/0025 D3)
   Claude Design DSL 서브셋 구현: {{expr}} 보간 · sc-for · sc-if ·
   on* 이벤트 바인딩 · style-hover · DCLogic(state/setState/lifecycle).
   미지원 sc-* 태그는 조용히 넘기지 않고 명시적 에러(화면 배너 + throw).

   원문 취득 우선순위:
   ① <script type="text/x-dc-template"> — dc-compile.mjs 번들 출력 (권장 배포 형태)
   ② fetch(현재 URL) 원문 재취득 — http(s) 서빙된 raw .dc 라이브 프리뷰
   ③ DOM 폴백(경고) — file://로 raw .dc를 직접 연 경우. 브라우저 파서의
      foster-parenting 때문에 <table> 내 sc-for·SVG 대소문자 속성이 깨질 수 있음.

   왜 자체 파서인가: 브라우저 HTML 파서는 <tbody> 안의 <sc-for>를 표 밖으로
   끌어내(foster parenting) 표 템플릿을 구조적으로 파괴한다. 원문 텍스트를
   직접 파싱하면 이 문제와 SVG 속성 소문자화(viewBox)가 모두 회피된다.
   ============================================================= */
(function () {
  'use strict';

  /* raw .dc를 직접 열었을 때 미렌더 {{ }} 플래시 방지 */
  var hider = document.createElement('style');
  hider.textContent = 'x-dc{display:none}';
  (document.head || document.documentElement).appendChild(hider);

  var VOID = { area: 1, base: 1, br: 1, col: 1, embed: 1, hr: 1, img: 1, input: 1, link: 1, meta: 1, source: 1, track: 1, wbr: 1 };
  var SVG_NS = 'http://www.w3.org/2000/svg';

  function decodeEnt(s) {
    return s.replace(/&(amp|lt|gt|quot|#39|apos);/g, function (m, k) {
      return { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'", apos: "'" }[k];
    });
  }

  /* ── 미니 HTML 파서 → {tag, attrs, children} / {text} 트리 ── */
  function parseTpl(src) {
    var root = { tag: '#root', attrs: {}, children: [] };
    var stack = [root];
    var re = /<!--[\s\S]*?-->|<\/([a-zA-Z][\w-]*)\s*>|<([a-zA-Z][\w-]*)((?:\s+[^\s=\/>]+(?:\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+))?)*)\s*(\/?)>/g;
    var last = 0, m;
    while ((m = re.exec(src))) {
      if (m.index > last) {
        var txt = src.slice(last, m.index);
        if (txt) stack[stack.length - 1].children.push({ text: decodeEnt(txt) });
      }
      last = re.lastIndex;
      if (m[0].slice(0, 4) === '<!--') continue;
      if (m[1]) { /* 닫는 태그 — 같은 이름을 찾을 때까지 pop */
        var closing = m[1].toLowerCase();
        for (var j = stack.length - 1; j > 0; j--) {
          if (stack[j].tag.toLowerCase() === closing) { stack.length = j; break; }
        }
      } else {
        var attrs = {}, ar = /([^\s=\/>]+)(?:\s*=\s*("([^"]*)"|'([^']*)'|([^\s>]+)))?/g, am;
        while ((am = ar.exec(m[3]))) {
          attrs[am[1]] = am[3] != null ? decodeEnt(am[3]) : am[4] != null ? decodeEnt(am[4]) : am[5] != null ? decodeEnt(am[5]) : '';
        }
        var node = { tag: m[2], attrs: attrs, children: [] };
        stack[stack.length - 1].children.push(node);
        if (!m[4] && !VOID[m[2].toLowerCase()]) stack.push(node);
      }
    }
    if (last < src.length) {
      var tail = src.slice(last);
      if (tail) stack[stack.length - 1].children.push({ text: decodeEnt(tail) });
    }
    return root;
  }

  /* ── 표현식 평가 ({{ }} 내부) — 스코프 체인은 프로토타입 체인으로 ── */
  var fnCache = {};
  function evalExpr(expr, scope) {
    var f = fnCache[expr] || (fnCache[expr] = new Function('__s', 'with(__s){return(' + expr + ')}'));
    try { return f(scope); }
    catch (e) { throw new Error('[dc] 표현식 평가 실패: {{ ' + expr + ' }} — ' + e.message); }
  }
  var MUSTACHE = /\{\{\s*([\s\S]+?)\s*\}\}/g;
  function interpolate(str, scope) {
    return str.replace(MUSTACHE, function (_, e) {
      var v = evalExpr(e, scope);
      return v == null ? '' : String(v);
    });
  }
  function soleExpr(str) {
    var m = /^\s*\{\{\s*([\s\S]+?)\s*\}\}\s*$/.exec(str);
    return m && m[1];
  }

  /* ── style-hover → 생성 클래스 (인라인 style은 :hover 불가) ── */
  var hoverMap = {}, hoverSeq = 0, hoverStyleEl = null;
  function hoverClass(css) {
    if (hoverMap[css]) return hoverMap[css];
    var cls = 'dc-hv' + (++hoverSeq);
    hoverMap[css] = cls;
    if (!hoverStyleEl) {
      hoverStyleEl = document.createElement('style');
      document.head.appendChild(hoverStyleEl);
    }
    hoverStyleEl.textContent += '.' + cls + ':hover{' + css + '}\n';
    return cls;
  }

  /* ── 트리 → DOM (out 배열에 push) ── */
  function build(node, scope, svgCtx, out) {
    if (node.text !== undefined) {
      out.push(document.createTextNode(node.text.indexOf('{{') >= 0 ? interpolate(node.text, scope) : node.text));
      return;
    }
    var tag = node.tag.toLowerCase();
    if (tag === 'sc-for') {
      var list = evalExpr(soleExpr(node.attrs.list || '') || 'null', scope) || [];
      var as = node.attrs.as || 'item';
      for (var i = 0; i < list.length; i++) {
        var s = Object.create(scope);
        s[as] = list[i];
        s[as + 'Index'] = i;
        for (var c = 0; c < node.children.length; c++) build(node.children[c], s, svgCtx, out);
      }
      return;
    }
    if (tag === 'sc-if') {
      if (evalExpr(soleExpr(node.attrs.value || '') || 'false', scope)) {
        for (var c2 = 0; c2 < node.children.length; c2++) build(node.children[c2], scope, svgCtx, out);
      }
      return;
    }
    if (tag.slice(0, 3) === 'sc-') {
      throw new Error('[dc] 미지원 DSL 태그: <' + node.tag + '> — support.js 서브셋(sc-for·sc-if)에 없음. 렌더러 확장 필요.');
    }
    var isSvg = svgCtx || tag === 'svg';
    var el = isSvg ? document.createElementNS(SVG_NS, node.tag) : document.createElement(tag);
    var events = null;
    for (var name in node.attrs) {
      var raw = node.attrs[name], lname = name.toLowerCase();
      if (lname.indexOf('hint-') === 0) continue;
      if (/^on[a-z]/.test(lname) && soleExpr(raw)) {
        var fn = evalExpr(soleExpr(raw), scope);
        if (typeof fn === 'function') { el[lname] = fn; (events = events || {})[lname] = fn; }
        continue;
      }
      if (lname === 'style-hover') {
        el.classList.add(hoverClass(raw.indexOf('{{') >= 0 ? interpolate(raw, scope) : raw));
        continue;
      }
      el.setAttribute(name, raw.indexOf('{{') >= 0 ? interpolate(raw, scope) : raw);
    }
    if (events) el.__dcEvents = events;
    var kids = [];
    for (var k = 0; k < node.children.length; k++) build(node.children[k], scope, isSvg, kids);
    for (var k2 = 0; k2 < kids.length; k2++) el.appendChild(kids[k2]);
    out.push(el);
  }

  /* ── 모프 (in-place 패치) — 전체 교체 대신 속성/텍스트만 갱신해
        CSS transition(게이지 채움·플로우 노드 점등 등)이 살아있게 한다 ── */
  function morph(live, fresh) {
    if (live.nodeType !== fresh.nodeType || (live.nodeType === 1 && live.nodeName !== fresh.nodeName)) {
      live.replaceWith(fresh);
      return;
    }
    if (live.nodeType === 3) {
      if (live.nodeValue !== fresh.nodeValue) live.nodeValue = fresh.nodeValue;
      return;
    }
    var i, a;
    for (i = live.attributes.length - 1; i >= 0; i--) {
      a = live.attributes[i];
      if (!fresh.hasAttribute(a.name)) live.removeAttribute(a.name);
    }
    for (i = 0; i < fresh.attributes.length; i++) {
      a = fresh.attributes[i];
      if (live.getAttribute(a.name) !== a.value) live.setAttribute(a.name, a.value);
    }
    var oe = live.__dcEvents || {}, ne = fresh.__dcEvents || {};
    for (var k1 in oe) if (!(k1 in ne)) live[k1] = null;
    for (var k2 in ne) live[k2] = ne[k2];
    live.__dcEvents = fresh.__dcEvents;
    var la = [].slice.call(live.childNodes), fa = [].slice.call(fresh.childNodes);
    for (i = 0; i < fa.length; i++) {
      if (i < la.length) morph(la[i], fa[i]);
      else live.appendChild(fa[i]);
    }
    for (i = la.length - 1; i >= fa.length; i--) live.removeChild(la[i]);
  }

  /* ── DCLogic 베이스 ── */
  function DCLogic(props) { this.props = props || {}; }
  DCLogic.prototype.setState = function (partial) {
    if (!this.state) this.state = {};
    Object.assign(this.state, partial);
    if (this.__dcRender) this.__dcRender();
  };

  function fail(e) {
    console.error(e);
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#ba1a1a;color:#fff;font:600 13px/1.5 monospace;padding:10px 16px;white-space:pre-wrap';
    box.textContent = String(e && e.message || e);
    document.body.appendChild(box);
    throw e;
  }

  function start(tplSrc, logicScript, anchorEl) {
    /* helmet → head (번들 출력엔 helmet이 이미 head에 있어 여기 안 옴) */
    var hm = /<helmet>([\s\S]*?)<\/helmet>/.exec(tplSrc);
    if (hm) {
      tplSrc = tplSrc.replace(hm[0], '');
      var tmp = document.createElement('div');
      tmp.innerHTML = hm[1];
      while (tmp.firstChild) document.head.appendChild(tmp.firstChild);
    }

    /* props 기본값: data-props JSON의 각 키.default ($preview 제외) */
    var props = {};
    if (logicScript) {
      var pj = logicScript.getAttribute('data-props');
      if (pj) {
        var spec = JSON.parse(pj);
        for (var k in spec) if (k !== '$preview' && spec[k] && 'default' in spec[k]) props[k] = spec[k].default;
      }
    }

    var Component = DCLogic;
    if (logicScript && logicScript.textContent.trim()) {
      Component = new Function('DCLogic', logicScript.textContent + ';return Component;')(DCLogic);
    }
    var inst = new Component(props);
    if (!inst.state) inst.state = {};

    var ast = parseTpl(tplSrc);
    var container = document.createElement('div');
    container.setAttribute('data-dc-root', '');
    var mounted = false;

    function render() {
      var vals = inst.renderVals ? inst.renderVals() : {};
      var out = [];
      for (var i = 0; i < ast.children.length; i++) build(ast.children[i], vals, false, out);
      if (!mounted) {
        for (var j = 0; j < out.length; j++) container.appendChild(out[j]);
      } else {
        var freshBox = document.createElement('div');
        for (var j2 = 0; j2 < out.length; j2++) freshBox.appendChild(out[j2]);
        var la = [].slice.call(container.childNodes), fa = [].slice.call(freshBox.childNodes);
        for (var x = 0; x < fa.length; x++) {
          if (x < la.length) morph(la[x], fa[x]);
          else container.appendChild(fa[x]);
        }
        for (var y = la.length - 1; y >= fa.length; y--) container.removeChild(la[y]);
      }
    }

    inst.__dcRender = function () { try { render(); } catch (e) { fail(e); } };
    render();
    anchorEl.replaceWith(container);
    mounted = true;
    if (inst.componentDidMount) inst.componentDidMount();
    if (inst.componentWillUnmount) {
      window.addEventListener('pagehide', function () { inst.componentWillUnmount(); });
    }
  }

  function boot() {
    try {
      var tplScript = document.querySelector('script[type="text/x-dc-template"]');
      var logicScript = document.querySelector('script[type="text/x-dc"]');
      if (tplScript) { start(tplScript.textContent, logicScript, tplScript); return; }
      var xdc = document.querySelector('x-dc');
      if (!xdc) return;
      fetch(location.href)
        .then(function (r) { return r.text(); })
        .then(function (txt) {
          var mm = /<x-dc>([\s\S]*?)<\/x-dc>/.exec(txt);
          start(mm ? mm[1] : xdc.innerHTML, logicScript, xdc);
        })
        .catch(function () {
          console.warn('[dc] 원문 fetch 실패(file:// 직접 오픈?) — DOM 폴백. <table> 내 sc-for·SVG 속성이 깨질 수 있음. dc-compile 번들 또는 http 서빙 권장.');
          try { start(xdc.innerHTML, logicScript, xdc); } catch (e) { fail(e); }
        });
    } catch (e) { fail(e); }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
